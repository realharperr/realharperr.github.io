<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>harperr</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="video-overlay"></div>

<video autoplay muted loop id="bg-video">
    <source src="background.mp4" type="video/mp4">
</video>

<div id="enter-screen">
    <div class="enter-content">
        <h1>hello.</h1>
    </div>
</div>

<div id="content" class="hidden">
    <div class="main-container">
        <div class="dec-bg">
            <img src="dec1.png" alt="decoration" class="decoration-bg">
        </div>
        <div class="dec-overlay"></div>
        <div class="left-panel">
            <div class="avatar">
                <img src="pfp.png" alt="avatar">
            </div>
            <h1 class="username">harperr</h1>
            <div class="pronouns-container">
                <p class="pronouns">victoria /vɪkˈtɔːriə/ (she/her)</p>
                <img src="flag.png" alt="trans flag" class="pronouns-flag">
            </div>
        </div>

        <div class="right-panel">
            <div class="music-player">
                <div class="track-info">
                    <img id="trackCover" class="track-cover" src="cover.png" alt="cover">
                    <div class="track-details">
                        <div id="trackTitle" class="track-title">mist</div>
                        <div id="trackArtist" class="track-artist">sally</div>
                    </div>
                </div>
                <button id="playPauseBtn" class="play-pause-btn">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>

            <div class="links">
                <a href="https://discord.com/users/456709019189379074" class="link-btn">
                    <i class="fab fa-discord"></i>
                </a>
                <a href="https://steamcommunity.com/id/itzharperr" class="link-btn">
                    <i class="fab fa-steam"></i>
                </a>
                <a href="https://www.youtube.com/@h_harperr" class="link-btn">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<audio id="background-music" loop preload="auto">
    <source src="background.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
